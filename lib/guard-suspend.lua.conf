    # >>> uisp-php2shell-guard (do not edit inside; remove with uninstall.sh) >>>
    # The suspended-service page never needs uploads or big bodies.
    access_by_lua_block {
      local MAX_ANON_BODY = __MAX_ANON_BODY__
      local ct  = ngx.var.http_content_type
      local len = tonumber(ngx.var.http_content_length or "")
      local te  = ngx.var.http_transfer_encoding
      if (ct and string.find(string.lower(ct), "multipart", 1, true)) or (len and len > MAX_ANON_BODY) or (te and te ~= "" and not len) then
        ngx.log(ngx.WARN, "uisp-php2shell-guard: blocked request on suspended page ", ngx.var.request_uri, " from ", ngx.var.remote_addr)
        return ngx.exit(403)
      end
    }
    # <<< uisp-php2shell-guard <<<
