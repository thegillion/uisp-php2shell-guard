# >>> uisp-php2shell-guard (do not edit inside; remove with uninstall.sh) >>>
# PHP2Shell (CVE-2026-109618 / CVE-2026-109619): the bugs fire while PHP parses
# the request, before UISP CRM checks the login. Until UISP ships a patched PHP,
# risky requests only reach PHP from a signed-in session (staff or client zone):
#   - any multipart/form-data (uploads)
#   - any body larger than MAX_ANON_BODY bytes
#   - any body without a declared length (chunked)
# The login check is a body-less GET to /crm/current-user. Other traffic is untouched.
access_by_lua_block {
  local MAX_ANON_BODY = __MAX_ANON_BODY__
  local ct  = ngx.var.http_content_type
  local len = tonumber(ngx.var.http_content_length or "")
  local te  = ngx.var.http_transfer_encoding
  local why = nil
  if ct and string.find(string.lower(ct), "multipart", 1, true) then why = "multipart"
  elseif len and len > MAX_ANON_BODY then why = "large body (" .. len .. " bytes)"
  elseif te and te ~= "" and not len then why = "body without length" end
  if not why then return end
  local res = ngx.location.capture("/__php2shell_guard_auth", { method = ngx.HTTP_GET })
  if res and res.status == 200 then return end
  ngx.log(ngx.WARN, "uisp-php2shell-guard: blocked ", why, " ", ngx.var.request_method, " ",
          ngx.var.request_uri, " from ", ngx.var.remote_addr, " (login check ", res and res.status or "failed", ")")
  ngx.status = 403
  ngx.header["Content-Type"] = "text/plain; charset=utf-8"
  ngx.say("Blocked: please sign in first. (Temporary security measure for PHP2Shell.)")
  return ngx.exit(403)
}
# <<< uisp-php2shell-guard <<<
